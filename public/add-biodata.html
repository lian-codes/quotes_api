  </nav>
  <h2>Add a New Biodata</h2>
  <div class="inputs">
    <label for="person">Name of the Person:</label>
    <input id="person" value="" required>
    <label for="born">Year Born:</label>
    <input id="born" value="" required>
    <label for="blurb">Blurb:</label>
    <input id="blurb" type="text" value="" required>
    <label for="knownFor">Known For:</label>
    <input id="knownFor" type="text" value="" required>
  </div>
  <div>
    <button id="submit-biodata">Submit New Biodata</button>
  </div>
  <div id="new-biodata">
   
  </div>
  <script src="/add-biodata.js"></script>
